<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bon Cadeau Le Melice</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="voucher">

    <img src="background.png" class="background" alt="Fond Bon Cadeau">

    <!-- Texte fixe -->

    <div class="label senderLabel">
        De la part de :
    </div>

    <div class="label recipientLabel">
        Pour :
    </div>

    <div class="label amountLabel">
        Bon d'une valeur de :
    </div>

    <div class="label messageLabel">
        Message :
    </div>


    <!-- Valeurs dynamiques -->

    <div id="sender" class="value sender">
        Thomas
    </div>

    <div id="recipient" class="value recipient">
        Marie
    </div>

    <div id="amount" class="value amount">
        100 €
    </div>

    <div id="message" class="value message">
        Joyeux anniversaire ❤️
    </div>

</div>

<script src="script.js"></script>

</body>

</html>
